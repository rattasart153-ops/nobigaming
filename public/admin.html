<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nobi Topup · Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2d;--panel2:#162238;--line:#27364f;--text:#eef5ff;--muted:#8da0bb;--cyan:#22d3ee;--purple:#a78bfa;--danger:#fb7185;--green:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#152644 0,transparent 45%),var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.2rem}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#08111f;font-weight:900}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2);color:var(--text)}.btn.primary{background:var(--cyan);color:#04111a;border-color:var(--cyan);font-weight:700}.btn.danger{color:var(--danger)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.login{max-width:440px;margin:8vh auto;background:var(--panel);padding:28px;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px #0005}.login h1{margin:0 0 6px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:.9rem;color:var(--muted)}input,select,textarea{width:100%;background:#0a1221;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px}.error{color:var(--danger);min-height:1.4em}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.side,.content,.stat,.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px}.side{padding:12px;height:max-content;position:sticky;top:20px}.nav{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:12px;color:var(--muted);background:transparent;margin:3px 0}.nav.active,.nav:hover{color:var(--cyan);background:#123044}.content{padding:22px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.heading h2{margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{font-size:1.65rem}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:740px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:.82rem;color:var(--muted);font-weight:500;background:#0e1728}td{font-size:.9rem}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.78rem;background:#253047;color:#cbd5e1}.badge.pending{color:#fbbf24;background:#3a2d13}.badge.completed{color:var(--green);background:#10342e}.badge.rejected{color:var(--danger);background:#3d1b2b}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:6px 9px;font-size:.8rem}.empty{padding:35px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#020617c9;display:grid;place-items:center;padding:20px;z-index:10}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-grid .wide{grid-column:1/-1}.dialog-head{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;bottom:20px;right:20px;background:#17243a;border:1px solid var(--cyan);border-radius:12px;padding:13px 16px;max-width:calc(100% - 40px);z-index:20}.slip{max-width:80px;max-height:60px;object-fit:cover;border-radius:6px;cursor:pointer}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:12px}.content{padding:14px}.top{align-items:flex-start}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:1.35rem}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><span class="logo">N</span><div>Nobi Topup <div class="muted" style="font-size:.78rem;font-weight:400">Administration panel</div></div></div><button id="logout" class="btn hidden">ออกจากระบบ</button></header>
<section id="loginPanel" class="login"><h1>เข้าสู่ระบบแอดมิน</h1><p class="muted">จัดการออเดอร์ เกม แพ็กเกจ คูปอง และโปรโมชั่น</p><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required value="NobiGaming"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p id="loginError" class="error"></p><button class="btn primary" style="width:100%">เข้าสู่ระบบ</button></form><p class="muted" style="font-size:.8rem;margin-top:18px">แนะนำให้เปลี่ยนรหัสผ่านเริ่มต้นในตัวแปร ADMIN_PASSWORD ก่อนนำขึ้นใช้งานจริง</p></section>
<section id="dashboard" class="hidden"><div class="stats" id="stats"></div><div class="layout"><aside class="side"><button class="nav active" data-tab="orders">📦 ออเดอร์</button><button class="nav" data-tab="games">🎮 เกม</button><button class="nav" data-tab="packages">💎 แพ็กเกจ</button><button class="nav" data-tab="coupons">🏷️ คูปอง</button><button class="nav" data-tab="promotions">🎉 โปรโมชั่น</button></aside><main class="content"><div class="heading"><div><h2 id="viewTitle">ออเดอร์</h2><p id="viewSub" class="muted">ตรวจสอบสลิปและอัปเดตสถานะ</p></div><button id="addBtn" class="btn primary hidden">+ เพิ่มรายการ</button></div><div id="view"></div></main></div></section></div>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialog-head"><h3 id="modalTitle">เพิ่มรายการ</h3><button id="closeModal" class="btn">ปิด</button></div><form id="editor"><div id="formFields" class="form-grid"></div><p id="formError" class="error"></p><div class="actions" style="justify-content:flex-end;margin-top:12px"><button type="button" id="cancelEdit" class="btn">ยกเลิก</button><button class="btn primary">บันทึก</button></div></form></div></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let currentTab='orders',rows=[],games=[],editingId=null,toastTimer;
const config={games:{title:'เกม',sub:'เพิ่ม แก้ไข หรือปิดการแสดงผลเกม',endpoint:'/api/admin/games',fields:[['name','ชื่อเกม','text',true],['category','หมวดหมู่','text',true],['description','คำอธิบาย','text',false],['active','เปิดใช้งาน','checkbox',false]]},packages:{title:'แพ็กเกจ',sub:'ตั้งราคา รูปภาพ และป้าย Popular Package',endpoint:'/api/admin/packages',fields:[['game_id','เกม','game',true],['name','ชื่อแพ็กเกจ','text',true],['amount','จำนวน','number',true],['unit','หน่วย','text',true],['price','ราคา (บาท)','number',true],['image_url','URL รูปภาพ','text',false],['popular','Popular Package','checkbox',false],['active','เปิดใช้งาน','checkbox',false]]},coupons:{title:'คูปองส่วนลด',sub:'กำหนดประเภทส่วนลด ยอดขั้นต่ำ เกม วันหมดอายุ และจำนวนใช้',endpoint:'/api/admin/coupons',fields:[['code','โค้ดส่วนลด','text',true],['discount_type','ประเภทส่วนลด','discountType',true],['discount_value','มูลค่าส่วนลด','number',true],['min_spend','ยอดซื้อขั้นต่ำ (บาท)','number',true],['game_id','ใช้ได้กับเกม (ว่าง = ทุกเกม)','gameOptional',false],['expires_at','หมดอายุ (วันที่/เวลา)','datetime',false],['usage_limit','จำกัดจำนวนครั้ง (ว่าง = ไม่จำกัด)','number',false],['active','เปิดใช้งาน','checkbox',false]]},promotions:{title:'โปรโมชั่น / แบนเนอร์',sub:'จัดการแบนเนอร์ที่แสดงบนหน้าแรก',endpoint:'/api/admin/promotions',fields:[['title','หัวข้อโปรโมชั่น','text',true],['subtitle','รายละเอียด','text',false],['image_url','URL รูปภาพ','text',false],['link_url','ลิงก์ปลายทาง','text',false],['sort_order','ลำดับการแสดง','number',false],['starts_at','เริ่มแสดง (วันที่/เวลา)','datetime',false],['ends_at','หยุดแสดง (วันที่/เวลา)','datetime',false],['active','เปิดใช้งาน','checkbox',false] ]}};
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{...(opts.body&&!(opts.body instanceof FormData)?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||data.message||'เกิดข้อผิดพลาด');return data}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showDashboard(on){$('#loginPanel').classList.toggle('hidden',on);$('#dashboard').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);if(on)loadTab('orders')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});showDashboard(true)}catch(err){$('#loginError').textContent=err.message}});
$('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}finally{showDashboard(false)}};
$$('.nav').forEach(b=>b.onclick=()=>{ $$('.nav').forEach(n=>n.classList.toggle('active',n===b));loadTab(b.dataset.tab)});
async function loadStats(){const d=await api('/api/admin/dashboard');$('#stats').innerHTML=[['ออเดอร์ทั้งหมด',d.orders],['รอตรวจสอบ',d.pending],['สำเร็จ',d.completed],['รายได้ที่อนุมัติ',`฿${Number(d.revenue).toLocaleString('th-TH')}`]].map(([l,v])=>`<div class="stat"><span>${l}</span><strong>${v}</strong></div>`).join('')}
async function loadTab(tab){currentTab=tab;$('#viewTitle').textContent=config[tab]?.title||'ออเดอร์';$('#viewSub').textContent=config[tab]?.sub||'ตรวจสอบสลิปและอัปเดตสถานะ';$('#addBtn').classList.toggle('hidden',tab==='orders');$('#view').innerHTML='<div class="empty">กำลังโหลดข้อมูล…</div>';try{await loadStats();if(tab==='orders'){rows=await api('/api/admin/orders');renderOrders()}else{rows=await api(config[tab].endpoint);if(tab==='packages'||tab==='coupons')games=await api('/api/admin/games');renderCrud(tab)}}catch(e){$('#view').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderOrders(){if(!rows.length){$('#view').innerHTML='<div class="empty">ยังไม่มีออเดอร์</div>';return}$('#view').innerHTML=`<div class="table-wrap"><table><thead><tr><th>ออเดอร์</th><th>เกม / แพ็กเกจ</th><th>UID / Server</th><th>ยอดสุทธิ</th><th>สลิป</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${esc(o.id)}</strong><br><small class="muted">${esc(o.created_at)}</small></td><td>${esc(o.game_name)}<br><small class="muted">${esc(o.package_name)}</small></td><td>${esc(o.player_id)}<br><small class="muted">${esc(o.server_id||'-')}</small></td><td>฿${Number(o.total).toLocaleString('th-TH')}<br><small class="muted">ส่วนลด ฿${Number(o.discount).toLocaleString('th-TH')}</small></td><td>${o.slip_path?`<a href="${esc(o.slip_path)}" target="_blank" rel="noopener"><img class="slip" src="${esc(o.slip_path)}" alt="สลิป"></a>`:'-'}</td><td><span class="badge ${o.status.toLowerCase()}">${esc(o.status)}</span></td><td><div class="actions"><button class="btn small" onclick="setStatus('${esc(o.id)}','Completed')">อนุมัติ</button><button class="btn small danger" onclick="setStatus('${esc(o.id)}','Rejected')">ปฏิเสธ</button></div></td></tr>`).join('')}</tbody></table></div>`}
window.setStatus=async(id,status)=>{if(!confirm(`ยืนยันเปลี่ยนสถานะเป็น ${status}?`))return;try{await api(`/api/admin/orders/${encodeURIComponent(id)}/status`,{method:'PATCH',body:JSON.stringify({status})});toast('อัปเดตสถานะแล้ว');loadTab('orders')}catch(e){toast(e.message)}};
function renderCrud(tab){const fields=config[tab].fields;const columns=tab==='games'?[['name','ชื่อเกม'],['category','หมวด'],['active','สถานะ']]:tab==='packages'?[['game_name','เกม'],['name','แพ็กเกจ'],['price','ราคา'],['popular','Popular'],['active','สถานะ']]:tab==='coupons'?[['code','โค้ด'],['discount_type','ประเภท'],['discount_value','ส่วนลด'],['min_spend','ยอดขั้นต่ำ'],['game_name','เกม'],['used_count','ใช้แล้ว'],['active','สถานะ']]:[['title','หัวข้อ'],['subtitle','รายละเอียด'],['active','สถานะ'],['sort_order','ลำดับ']];if(!rows.length){$('#view').innerHTML='<div class="empty">ยังไม่มีข้อมูล กด “เพิ่มรายการ” เพื่อสร้างรายการแรก</div>';return}$('#view').innerHTML=`<div class="table-wrap"><table><thead><tr>${columns.map(c=>`<th>${c[1]}</th>`).join('')}<th>จัดการ</th></tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(([k,label])=>`<td>${k==='active'||k==='popular'?`<span class="badge ${r[k]?'completed':''}">${r[k]?'เปิด':'ปิด'}</span>`:k==='price'?`฿${Number(r[k]).toLocaleString('th-TH')}`:esc(r[k]??'-')}</td>`).join('')}<td><div class="actions"><button class="btn small" onclick="editRow(${r.id})">แก้ไข</button><button class="btn small danger" onclick="deleteRow(${r.id})">ลบ</button></div></td></tr>`).join('')}</tbody></table></div>`}
function openEditor(row=null){editingId=row?.id??null;$('#modalTitle').textContent=editingId?'แก้ไขรายการ':'เพิ่มรายการ';$('#formError').textContent='';const fields=config[currentTab].fields;$('#formFields').innerHTML=fields.map(([key,label,type,required])=>{let val=row?.[key];if(type==='checkbox')return `<div class="field"><label><input style="width:auto;margin-right:8px" name="${key}" type="checkbox" ${val===undefined?((key==='active'||key==='popular')?'checked':''):val?'checked':''}>${label}</label></div>`;if(type==='game'||type==='gameOptional'){const options=(type==='gameOptional'?'<option value="">ทุกเกม</option>':'<option value="">เลือกเกม</option>')+games.map(g=>`<option value="${g.id}" ${String(val??'')===String(g.id)?'selected':''}>${esc(g.name)}</option>`).join('');return `<div class="field ${type==='gameOptional'?'wide':''}"><label>${label}</label><select name="${key}" ${required?'required':''}>${options}</select></div>`}if(type==='discountType')return `<div class="field"><label>${label}</label><select name="${key}"><option value="fixed" ${val!=='percent'?'selected':''}>ลดเป็นบาท</option><option value="percent" ${val==='percent'?'selected':''}>ลดเป็นเปอร์เซ็นต์</option></select></div>`;let v=val??(key==='link_url'?'#games':key==='sort_order'?0:'');if(type==='datetime'&&v)v=String(v).replace(' ','T').slice(0,16);return `<div class="field ${['image_url','subtitle','description'].includes(key)?'wide':''}"><label>${label}</label><input name="${key}" type="${type==='datetime'?'datetime-local':type}" value="${esc(v)}" ${required?'required':''} ${key==='discount_value'||key==='min_spend'||key==='price'||key==='amount'||key==='sort_order'||key==='usage_limit'?'min="0"':''}></div>`}).join('');$('#modal').classList.remove('hidden')}
window.editRow=id=>{const r=rows.find(x=>x.id===id);openEditor(r)};window.deleteRow=async id=>{if(!confirm('ลบรายการนี้ใช่หรือไม่?'))return;try{await api(`${config[currentTab].endpoint}/${id}`,{method:'DELETE'});toast('ลบรายการแล้ว');loadTab(currentTab)}catch(e){toast(e.message)}};
$('#addBtn').onclick=()=>openEditor();$('#closeModal').onclick=$('#cancelEdit').onclick=()=>$('#modal').classList.add('hidden');$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').classList.add('hidden')});
$('#editor').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target),body={};for(const [key,label,type] of config[currentTab].fields){if(type==='checkbox')body[key]=form.has(key);else if(type==='number')body[key]=form.get(key)===''?null:Number(form.get(key));else body[key]=form.get(key)||null}if(currentTab==='coupons'&&body.game_id==='')body.game_id=null;if(currentTab==='coupons'&&body.usage_limit===null)body.usage_limit=null;if(currentTab==='promotions'||currentTab==='coupons'){for(const k of ['starts_at','ends_at','expires_at'])if(body[k])body[k]=new Date(body[k]).toISOString()}try{await api(`${config[currentTab].endpoint}${editingId?'/'+editingId:''}`,{method:editingId?'PUT':'POST',body:JSON.stringify(body)});$('#modal').classList.add('hidden');toast('บันทึกข้อมูลแล้ว');loadTab(currentTab)}catch(err){$('#formError').textContent=err.message}});
(async()=>{try{const me=await api('/api/admin/me');showDashboard(me.authenticated)}catch{showDashboard(false)}})();
</script></body></html>
