name = "nobi-topup"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-29"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "nobi-topup-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "nobi-topup-uploads"
