services:
  - type: web
    name: nobi-topup
    runtime: node
    plan: free
    buildCommand: unzip -o nobigaming-github-upload.zip -d . && cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DB_FILE
        value: ./data/nobi.sqlite
